# Despliegue en Render (https://render.com) con el botón "Deploy to Render" del README.
services:
  - type: web
    name: resiliente-chat
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render pone un proxy HTTPS delante: hay que fiarse de sus cabeceras X-Forwarded-*.
      - key: TRUST_PROXY
        value: "true"
      - key: TLS
        value: "off"
